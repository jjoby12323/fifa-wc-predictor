app = "fifa-wc-predictor"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "fifa_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/fifa.db"
