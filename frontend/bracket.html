<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA WC 2026 — Standings & Bracket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚽ FIFA WC 2026</h1>
    <p class="subtitle">Standings &amp; Bracket</p>
    <nav style="margin-left:auto;display:flex;gap:10px">
      <a href="javascript:history.back()" class="nav-link">← Back</a>
      <a id="lb-link" href="leaderboard.html" class="nav-link">Leaderboard →</a>
    </nav>
  </header>

  <!-- Tabs -->
  <div class="page-tabs">
    <button class="page-tab active" id="tab-groups" onclick="switchTab('groups')">🏆 Group Stage</button>
    <button class="page-tab" id="tab-bracket" onclick="switchTab('bracket')">🗂 Knockout Bracket</button>
  </div>

  <!-- Group standings -->
  <div id="panel-groups" class="tab-panel">
    <div id="standings-loading" class="loading">Loading standings…</div>
    <div id="standings-error" class="error-banner hidden"></div>
    <div id="groups-grid" class="groups-grid"></div>
  </div>

  <!-- Knockout bracket -->
  <div id="panel-bracket" class="tab-panel hidden">
    <div id="bracket-loading" class="loading">Loading bracket…</div>
    <div id="bracket-error" class="error-banner hidden"></div>
    <div id="bracket-scroll" class="bracket-scroll">
      <div id="bracket-inner" class="bracket-inner"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // ── Auth passthrough ──────────────────────────────────────────
    const { user, sig } = getAuth();
    if (user && sig) {
      document.getElementById("lb-link").href =
        `leaderboard.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;
    }

    // ── Tab switching ─────────────────────────────────────────────
    let bracketLoaded = false;

    function switchTab(name) {
      document.querySelectorAll(".page-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
      document.getElementById(`tab-${name}`).classList.add("active");
      document.getElementById(`panel-${name}`).classList.remove("hidden");
      if (name === "bracket" && !bracketLoaded) {
        bracketLoaded = true;
        loadBracket();
      }
    }

    // ── Group standings ───────────────────────────────────────────
    async function loadStandings() {
      try {
        const data = await apiFetch("/api/standings");
        document.getElementById("standings-loading").classList.add("hidden");

        const note = document.getElementById("standings-error");
        if (data.error && !data.groups.length) {
          note.className = "error-banner";
          note.textContent = data.error;
          return;
        }

        if (!data.groups.length) {
          note.className = "empty-note";
          note.innerHTML = `📊 Group standings will appear here once the tournament kicks off.
            <div class="empty-sub">They update live from football-data.org as matches are played.</div>`;
          return;
        }

        note.className = "error-banner hidden";  // data present — clear any prior note

        const grid = document.getElementById("groups-grid");
        grid.innerHTML = "";

        for (const g of data.groups) {
          const card = document.createElement("div");
          card.className = "group-card";
          card.innerHTML = `
            <h3 class="group-title">${escHtml(g.group)}</h3>
            <table class="standings-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th class="th-team">Team</th>
                  <th title="Played">MP</th>
                  <th title="Won">W</th>
                  <th title="Drawn">D</th>
                  <th title="Lost">L</th>
                  <th title="Goals For">GF</th>
                  <th title="Goals Against">GA</th>
                  <th title="Goal Difference">GD</th>
                  <th title="Points">Pts</th>
                </tr>
              </thead>
              <tbody>
                ${g.table.map((row, i) => `
                  <tr class="${i < 2 ? 'qualifier' : ''}">
                    <td class="pos">${row.position}</td>
                    <td class="team-cell">
                      ${flagImg(row.team)}
                      <span>${escHtml(row.team)}</span>
                    </td>
                    <td>${row.played}</td>
                    <td>${row.won}</td>
                    <td>${row.drawn}</td>
                    <td>${row.lost}</td>
                    <td>${row.goals_for}</td>
                    <td>${row.goals_against}</td>
                    <td class="${row.goal_diff > 0 ? 'pos-gd' : row.goal_diff < 0 ? 'neg-gd' : ''}">${row.goal_diff > 0 ? '+' : ''}${row.goal_diff}</td>
                    <td class="pts">${row.points}</td>
                  </tr>`).join("")}
              </tbody>
            </table>`;
          grid.appendChild(card);
        }
      } catch (err) {
        document.getElementById("standings-loading").classList.add("hidden");
        const note = document.getElementById("standings-error");
        note.className = "error-banner";
        note.textContent = err.message;
      }
    }

    function flagImg(teamName) {
      const url = getFlagUrl(teamName);
      return url
        ? `<img src="${url}" class="st-flag" alt="" onerror="this.style.display='none'">`
        : `<span class="st-flag-ph">🏳</span>`;
    }

    // ── Knockout bracket (two-sided, converging to the centre) ─────
    let bracketMatches = null;

    async function loadBracket() {
      try {
        const matches = await apiFetch("/api/bracket");
        document.getElementById("bracket-loading").classList.add("hidden");
        const errEl = document.getElementById("bracket-error");
        if (!matches.length) {
          errEl.className = "empty-note";
          errEl.textContent = "The knockout bracket appears here once the fixtures are scheduled.";
          return;
        }
        errEl.className = "error-banner hidden";
        bracketMatches = matches;
        renderBracket();
      } catch (err) {
        document.getElementById("bracket-loading").classList.add("hidden");
        const errEl = document.getElementById("bracket-error");
        errEl.className = "error-banner";
        errEl.textContent = err.message;
      }
    }

    // Desktop: mirrored two-sided bracket with SVG connectors.
    // Mobile: a single left-to-right column flow that scrolls horizontally — no mirroring,
    // no connectors, nothing to collapse (the two-sided layout is unusable on a phone).
    function renderBracket() {
      if (!bracketMatches) return;
      const byStage = {};
      for (const m of bracketMatches) (byStage[m.stage] = byStage[m.stage] || []).push(m);
      for (const s in byStage) byStage[s].sort((a, b) => (a.kickoff_utc < b.kickoff_utc ? -1 : 1));
      const inner = document.getElementById("bracket-inner");
      inner.querySelectorAll("svg.br2-lines").forEach(s => s.remove());

      if (window.matchMedia("(max-width: 600px)").matches) {
        const mcol = (label, ms) => (ms && ms.length)
          ? `<div class="brm-col"><div class="br2-round-head">${label}</div>${ms.map(bracketMatchHtml).join("")}</div>`
          : "";
        inner.className = "bracket-inner brm";
        inner.innerHTML =
          mcol("R32", byStage.r32) + mcol("R16", byStage.r16) + mcol("QF", byStage.qf) +
          mcol("SF", byStage.sf) + mcol("Final", byStage.final) + mcol("3rd Place", byStage.third);
        return;  // linear flow — no connectors needed
      }

      // Split each round in half — left side feeds inward, right side mirrors.
      const half = (a = []) => { const n = Math.ceil(a.length / 2); return [a.slice(0, n), a.slice(n)]; };
      const [r32L, r32R] = half(byStage.r32);
      const [r16L, r16R] = half(byStage.r16);
      const [qfL,  qfR]  = half(byStage.qf);
      const [sfL,  sfR]  = half(byStage.sf);
      const finalM = (byStage.final || [])[0];
      const thirdM = (byStage.third || [])[0];
      const col = (label, ms) => `
        <div class="br2-round">
          <div class="br2-round-head">${label}</div>
          <div class="br2-round-body">${(ms || []).map(bracketMatchHtml).join("")}</div>
        </div>`;
      inner.className = "bracket-inner";
      inner.innerHTML = `
        <div class="br2-side br2-left">
          ${col("R32", r32L)}${col("R16", r16L)}${col("QF", qfL)}${col("SF", sfL)}
        </div>
        <div class="br2-center">
          <div class="br2-center-label">Final</div>
          ${finalM ? bracketMatchHtml(finalM) : ""}
          <div class="br2-trophy"><span class="br2-trophy-icon">🏆</span><span class="br2-trophy-cap">Champion</span></div>
          ${thirdM ? `<div class="br2-third-label">3rd Place</div>${bracketMatchHtml(thirdM)}` : ""}
        </div>
        <div class="br2-side br2-right">
          ${col("SF", sfR)}${col("QF", qfR)}${col("R16", r16R)}${col("R32", r32R)}
        </div>`;
      requestAnimationFrame(drawConnectors);
    }

    // Connector lines drawn as an SVG overlay from the real card positions,
    // so they always line up regardless of how the cards flow.
    function drawConnectors() {
      const inner = document.getElementById("bracket-inner");
      if (!inner || !inner.querySelector(".br2-side")) return;
      inner.querySelectorAll("svg.br2-lines").forEach(s => s.remove());
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "br2-lines");
      svg.setAttribute("width", inner.scrollWidth);
      svg.setAttribute("height", inner.scrollHeight);
      inner.appendChild(svg);

      const base = inner.getBoundingClientRect();
      const geo = el => { const r = el.getBoundingClientRect(); return { l: r.left - base.left, r: r.right - base.left, cy: r.top - base.top + r.height / 2 }; };
      const line = (x1, y1, x2, y2) => {
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", x1); ln.setAttribute("y1", y1); ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
        svg.appendChild(ln);
      };
      // elbow from one card to another; dir +1 flows right, -1 flows left
      const elbow = (from, to, dir) => {
        const a = geo(from), b = geo(to);
        const ax = dir > 0 ? a.r : a.l, bx = dir > 0 ? b.l : b.r, mid = (ax + bx) / 2;
        line(ax, a.cy, mid, a.cy);
        line(mid, a.cy, mid, b.cy);
        line(mid, b.cy, bx, b.cy);
      };
      const cardsIn = body => [...body.querySelectorAll(".bracket-match")];
      const link = (fromBody, toBody, dir) => {
        const from = cardsIn(fromBody), to = cardsIn(toBody);
        for (let k = 0; k < to.length; k++) {
          if (from[2 * k]) elbow(from[2 * k], to[k], dir);
          if (from[2 * k + 1]) elbow(from[2 * k + 1], to[k], dir);
        }
      };

      const L = [...inner.querySelectorAll(".br2-left .br2-round-body")];   // [r32, r16, qf, sf]
      const R = [...inner.querySelectorAll(".br2-right .br2-round-body")];  // [sf, qf, r16, r32]
      for (let i = 0; i < L.length - 1; i++) link(L[i], L[i + 1], +1);
      for (let i = R.length - 1; i > 0; i--) link(R[i], R[i - 1], -1);

      const finalCard = inner.querySelector(".br2-center .bracket-match");
      const sfLcard = cardsIn(L[L.length - 1])[0];
      const sfRcard = cardsIn(R[0])[0];
      if (finalCard && sfLcard) elbow(sfLcard, finalCard, +1);
      if (finalCard && sfRcard) elbow(sfRcard, finalCard, -1);
    }

    function bracketMatchHtml(m) {
      const kickoff = new Date((m.kickoff_utc.endsWith("Z") ? m.kickoff_utc : m.kickoff_utc + "Z"));
      const dateStr = isNaN(kickoff) ? "" : kickoff.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      const timeStr = isNaN(kickoff) ? "" : kickoff.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

      const isTbd = (name) => !name || name === "TBD";
      const teamClass = (side) => {
        if (m.result === side) return "bm-team winner";
        if (m.result && m.result !== side) return "bm-team loser";
        return "bm-team";
      };

      const teamHtml = (name, side) => `
        <div class="${teamClass(side)}">
          ${isTbd(name)
            ? `<span class="bm-flag-ph">🏳</span>`
            : (() => { const u = getFlagUrl(name); return u ? `<img src="${u}" class="bm-flag" onerror="this.style.display='none'">` : `<span class="bm-flag-ph">🏳</span>`; })()
          }
          <span class="bm-name" title="${isTbd(name) ? '' : escHtml(name)}">${isTbd(name) ? '<span class="tbd">TBD</span>' : escHtml(getTeamCode(name))}</span>
          ${m.result === side ? `<span class="bm-win-mark">✓</span>` : ""}
        </div>`;

      return `
        <div class="bracket-match ${m.status}">
          <div class="bm-date">${dateStr} ${timeStr}</div>
          ${teamHtml(m.team_a, "team_a")}
          <div class="bm-sep"></div>
          ${teamHtml(m.team_b, "team_b")}
        </div>`;
    }

    // ── Init ──────────────────────────────────────────────────────
    loadStandings();
    setInterval(loadStandings, 120_000); // refresh every 2 min
    let _bracketResizeTimer;
    window.addEventListener("resize", () => {
      if (!bracketMatches) return;
      clearTimeout(_bracketResizeTimer);
      _bracketResizeTimer = setTimeout(renderBracket, 150);  // re-render swaps mobile/desktop layout
    });
  </script>
</body>
</html>
