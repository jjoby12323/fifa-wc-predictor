<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — FIFA WC 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚽ FIFA WC 2026 Leaderboard</h1>
    <nav style="margin-left:auto;display:flex;gap:10px">
      <a href="index.html" class="nav-link" id="vote-link">← Predictions</a>
      <a href="bracket.html" class="nav-link" id="bracket-link">Standings & Bracket →</a>
    </nav>
  </header>

  <main id="app">
    <div id="error-banner" class="error-banner hidden"></div>
    <div id="loading" class="loading">Loading leaderboard…</div>

    <div id="leaderboard-container" class="hidden">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th title="Total points">Total</th>
            <th title="Base points from correct predictions">Base</th>
            <th title="+1 per 3 consecutive correct">Streak 🔥</th>
            <th title="+2 for a perfect matchday (2+ matches)">Perfect ⭐</th>
            <th title="+1 for every 3 matches you vote on">Turnout 🙌</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>

      <div id="my-breakdown" class="breakdown hidden">
        <h2>Your Match Breakdown</h2>
        <div id="breakdown-body"></div>
      </div>
    </div>

    <p class="refresh-note" id="refresh-note"></p>
  </main>

  <!-- Profile modal -->
  <div id="profile-modal" class="modal-backdrop hidden" onclick="closeProfile(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Prediction History</h2>
        <button class="modal-close" aria-label="Close" onclick="closeProfile()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Chat widget -->
  <div id="chat-widget" class="chat-widget">
    <div class="chat-header" onclick="toggleChat()">
      💬 Smack Talk <span id="chat-unread" class="chat-unread hidden"></span>
      <span class="chat-toggle-icon" id="chat-toggle-icon">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row" id="chat-input-row">
        <input id="chat-input" class="chat-input" type="text" placeholder="Say something..." maxlength="280" />
        <button class="chat-send" onclick="sendMessage()">Send</button>
      </div>
      <div id="chat-readonly-note" class="chat-readonly hidden">Open your personal link to chat.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async () => {
      const { user, sig } = getAuth();

      if (user && sig) {
        document.getElementById("vote-link").href =
          `index.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;
        document.getElementById("bracket-link").href =
          `bracket.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;

      }

      await loadLeaderboard();
      setInterval(loadLeaderboard, 60_000);
    })();

    async function loadLeaderboard() {
      const { user, sig } = getAuth();
      if (!user || !sig) {
        showError("Viewing the shared leaderboard — open your personal link to see your own breakdown.");
      }

      let board;
      try {
        const auth = (user && sig) ? `?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}` : "";
        board = await apiFetch(`/api/leaderboard${auth}`);
      } catch (err) {
        showError(err.message);
        document.getElementById("loading").classList.add("hidden");
        return;
      }

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("leaderboard-container").classList.remove("hidden");

      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = "";
      for (const row of board) {
        const tr = document.createElement("tr");
        if (row.username === user) tr.classList.add("me");
        tr.innerHTML = `
          <td class="rank">${row.rank}</td>
          <td class="name"><a class="profile-link" onclick="openProfile('${escHtml(row.username)}', '${escHtml(row.display_name)}')">${escHtml(row.display_name)}</a></td>
          <td class="total"><strong>${row.total}</strong></td>
          <td>${row.base}</td>
          <td>${row.streak || "—"}</td>
          <td>${row.perfect || "—"}</td>
          <td>${row.participation || "—"}</td>
        `;
        tbody.appendChild(tr);
      }

      if (user && sig) {
        try {
          const history = await apiFetch(`/api/users/${encodeURIComponent(user)}/history?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`);
          if (history.some(r => r.result)) {
            document.getElementById("my-breakdown").classList.remove("hidden");
            document.getElementById("breakdown-body").innerHTML = buildBreakdownHtml(history);
          }
        } catch (_) {}
      }

      document.getElementById("refresh-note").textContent =
        `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    // Build the grouped-by-matchday breakdown (shared by the profile modal and
    // the "Your Match Breakdown" section). Takes /api/users/{name}/history rows.
    function buildBreakdownHtml(history) {
      const stageLabel = { group: "Group Stage", r32: "Round of 32", r16: "Round of 16", qf: "Quarter-Final", sf: "Semi-Final", final: "Final", third: "3rd Place" };
      const teamOf = (r, pred) => pred === "team_a" ? r.match_label.split(" vs ")[0] : r.match_label.split(" vs ")[1];

      const byMd = {};
      for (const r of history) (byMd[r.matchday] = byMd[r.matchday] || []).push(r);
      const mds = Object.keys(byMd).map(Number).sort((a, b) => a - b).filter(md => byMd[md].some(r => r.result));
      if (!mds.length) return `<p class="empty-note" style="padding:24px">No settled matches yet.</p>`;

      const ptsTxt = n => (n ? "+" + n : "0");
      let grand = 0;
      const trs = [];
      for (const md of mds) {
        const rows = byMd[md].filter(r => r.result);  // settled matches in this matchday
        const title = rows[0].stage === "group" ? `Matchday ${md}` : (stageLabel[rows[0].stage] || `Matchday ${md}`);

        const streak  = rows.reduce((a, r) => a + r.streak_bonus, 0);
        const perfect = rows.reduce((a, r) => a + r.perfect_round_bonus, 0);
        const turnout = rows.reduce((a, r) => a + r.participation_bonus, 0);
        const subtotal = rows.reduce((a, r) => a + r.base_points, 0) + streak + perfect + turnout;
        grand += subtotal;

        trs.push(`<tr class="bd-head"><td colspan="3">${title}</td><td class="bd-pts bd-sub">${subtotal} pt${subtotal === 1 ? "" : "s"}</td></tr>`);
        for (const r of rows) {
          const [oc, ocCls] = !r.prediction ? ["No pick", "bd-skip"]
            : r.result === "draw" ? ["Draw", "bd-draw"]
            : r.correct === true ? ["Correct", "bd-ok"]
            : ["Wrong", "bd-no"];
          const pick = r.prediction ? escHtml(teamOf(r, r.prediction)) : "—";
          trs.push(`<tr>
            <td>${escHtml(r.match_label)}</td>
            <td>${pick}</td>
            <td class="${ocCls}">${oc}</td>
            <td class="bd-pts">${ptsTxt(r.base_points)}</td>
          </tr>`);
        }
        if (streak)  trs.push(`<tr class="bd-bonus"><td colspan="3">🔥 Streak bonus</td><td class="bd-pts">+${streak}</td></tr>`);
        if (perfect) trs.push(`<tr class="bd-bonus"><td colspan="3">⭐ Perfect matchday</td><td class="bd-pts">+${perfect}</td></tr>`);
        if (turnout) trs.push(`<tr class="bd-bonus"><td colspan="3">🙌 Turnout</td><td class="bd-pts">+${turnout}</td></tr>`);
      }
      trs.push(`<tr class="bd-grand"><td colspan="3">Total</td><td class="bd-pts">${grand} pt${grand === 1 ? "" : "s"}</td></tr>`);
      return `<div class="bd-wrap"><table class="bd-table"><tbody>${trs.join("")}</tbody></table></div>`;
    }

    // ── Profile modal ─────────────────────────────────────────────
    async function openProfile(username, displayName) {
      const { user, sig } = getAuth();
      if (!user || !sig) return;
      document.getElementById("modal-title").textContent = `${displayName}'s Predictions`;
      document.getElementById("modal-body").innerHTML = `<div class="loading">Loading…</div>`;
      document.getElementById("profile-modal").classList.remove("hidden");

      const history = await apiFetch(
        `/api/users/${encodeURIComponent(username)}/history?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`
      ).catch(err => { document.getElementById("modal-body").innerHTML = `<p class="error">${err.message}</p>`; return null; });
      if (!history) return;

      document.getElementById("modal-body").innerHTML = buildBreakdownHtml(history);
    }

    function closeProfile(e) {
      if (!e || e.target === document.getElementById("profile-modal")) {
        document.getElementById("profile-modal").classList.add("hidden");
      }
    }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });

    // Smack-talk chat (load/render/reply) is initialised in app.js — shared across pages.
  </script>
</body>
</html>
