<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — FIFA WC 2026</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header>
    <h1>⚽ FIFA WC 2026 Leaderboard</h1>
    <a href="index.html" class="nav-link" id="vote-link">← Predictions</a>
    <a href="bracket.html" class="nav-link" id="bracket-link">Standings & Bracket →</a>
  </header>

  <main id="app">
    <div id="error-banner" class="error-banner hidden"></div>
    <div id="loading" class="loading">Loading leaderboard…</div>

    <div id="leaderboard-container" class="hidden">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th title="Total points">Total</th>
            <th title="Base points from correct predictions">Base</th>
            <th title="+1 per 3 consecutive correct">Streak 🔥</th>
            <th title="+2 for a perfect matchday">Perfect ⭐</th>
            <th title="+1 for every 3 matches you vote on">Turnout 🙌</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>

      <div id="my-breakdown" class="breakdown hidden">
        <h2>Your Match Breakdown</h2>
        <table class="breakdown-table">
          <thead>
            <tr>
              <th>Match</th>
              <th>Base</th>
              <th>Streak</th>
              <th>Perfect</th>
              <th>Turnout</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="breakdown-body"></tbody>
        </table>
      </div>
    </div>

    <p class="refresh-note" id="refresh-note"></p>
  </main>

  <!-- Profile modal -->
  <div id="profile-modal" class="modal-backdrop hidden" onclick="closeProfile(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Prediction History</h2>
        <button class="modal-close" onclick="closeProfile()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Chat widget -->
  <div id="chat-widget" class="chat-widget">
    <div class="chat-header" onclick="toggleChat()">
      💬 Smack Talk <span id="chat-unread" class="chat-unread hidden"></span>
      <span class="chat-toggle-icon" id="chat-toggle-icon">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row" id="chat-input-row">
        <input id="chat-input" class="chat-input" type="text" placeholder="Say something..." maxlength="280" />
        <button class="chat-send" onclick="sendMessage()">Send</button>
      </div>
      <div id="chat-readonly-note" class="chat-readonly hidden">Open your personal link to chat.</div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
  <script>
    (async () => {
      const { user, sig } = getAuth();

      if (user && sig) {
        document.getElementById("vote-link").href =
          `index.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;
        document.getElementById("bracket-link").href =
          `bracket.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;

      }

      await loadLeaderboard();
      setInterval(loadLeaderboard, 60_000);
    })();

    async function loadLeaderboard() {
      const { user, sig } = getAuth();
      if (!user || !sig) {
        showError("No valid link — leaderboard visible but your breakdown is unavailable.");
      }

      let board;
      try {
        board = await apiFetch(`/api/leaderboard?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`);
      } catch (err) {
        showError(err.message);
        document.getElementById("loading").classList.add("hidden");
        return;
      }

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("leaderboard-container").classList.remove("hidden");

      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = "";
      for (const row of board) {
        const tr = document.createElement("tr");
        if (row.username === user) tr.classList.add("me");
        tr.innerHTML = `
          <td class="rank">${row.rank}</td>
          <td class="name"><a class="profile-link" onclick="openProfile('${escHtml(row.username)}', '${escHtml(row.display_name)}')">${escHtml(row.display_name)}</a></td>
          <td class="total"><strong>${row.total}</strong></td>
          <td>${row.base}</td>
          <td>${row.streak || "—"}</td>
          <td>${row.perfect || "—"}</td>
          <td>${row.participation || "—"}</td>
        `;
        tbody.appendChild(tr);
      }

      if (user && sig) {
        try {
          const breakdown = await apiFetch(`/api/me?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`);
          if (breakdown.length > 0) {
            document.getElementById("my-breakdown").classList.remove("hidden");
            const bbody = document.getElementById("breakdown-body");
            bbody.innerHTML = "";
            for (const r of breakdown) {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${escHtml(r.match_label)}</td>
                <td>${r.base_points}</td>
                <td>${r.streak_bonus || "—"}</td>
                <td>${r.perfect_round_bonus || "—"}</td>
                <td>${r.participation_bonus || "—"}</td>
                <td><strong>${r.total}</strong></td>
              `;
              bbody.appendChild(tr);
            }
          }
        } catch (_) {}
      }

      document.getElementById("refresh-note").textContent =
        `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    // ── Profile modal ─────────────────────────────────────────────
    async function openProfile(username, displayName) {
      const { user, sig } = getAuth();
      if (!user || !sig) return;
      document.getElementById("modal-title").textContent = `${displayName}'s Predictions`;
      document.getElementById("modal-body").innerHTML = `<div class="loading">Loading…</div>`;
      document.getElementById("profile-modal").classList.remove("hidden");

      const history = await apiFetch(
        `/api/users/${encodeURIComponent(username)}/history?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`
      ).catch(err => { document.getElementById("modal-body").innerHTML = `<p class="error">${err.message}</p>`; return null; });
      if (!history) return;

      const stageLabel = { group: "Group", r16: "R16", qf: "QF", sf: "SF", final: "Final" };
      document.getElementById("modal-body").innerHTML = `
        <table class="breakdown-table">
          <thead><tr><th>Match</th><th>Stage</th><th>Pick</th><th>Result</th><th>Pts</th></tr></thead>
          <tbody>
            ${history.map(r => {
              const pickLabel = r.prediction ? (r.prediction === "team_a" ? r.match_label.split(" vs ")[0] : r.match_label.split(" vs ")[1]) : "—";
              const resultClass = r.correct === true ? "correct" : r.correct === false ? "wrong" : "";
              const resultIcon = r.correct === true ? "✓" : r.correct === false ? "✗" : "—";
              return `<tr class="${resultClass}">
                <td>${escHtml(r.match_label)}</td>
                <td>${stageLabel[r.stage] || r.stage}</td>
                <td>${escHtml(pickLabel)}</td>
                <td>${resultIcon}</td>
                <td>${r.points || "—"}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`;
    }

    function closeProfile(e) {
      if (!e || e.target === document.getElementById("profile-modal")) {
        document.getElementById("profile-modal").classList.add("hidden");
      }
    }

    // ── Chat ──────────────────────────────────────────────────────
    let chatOpen = false;
    let lastSeenId = 0;       // newest message id the user has already seen
    let chatPrimed = false;   // first poll seeds the baseline so existing history isn't "unread"

    async function loadChat() {
      const msgs = await apiFetch("/api/chat").catch(() => []);
      renderChat(msgs);

      const latestId = msgs.length ? msgs[msgs.length - 1].id : 0;

      // First load: treat all existing messages as seen — only notify going forward.
      if (!chatPrimed) {
        lastSeenId = latestId;
        chatPrimed = true;
        return;
      }

      // Chat open: the user is reading in real time, so keep the baseline current.
      if (chatOpen) {
        lastSeenId = latestId;
        return;
      }

      // Chat closed: anything newer than the baseline (and not your own) is unread.
      const { user } = getAuth();
      const unread = msgs.filter(m => m.id > lastSeenId && m.username !== user);
      if (unread.length) {
        const dot = document.getElementById("chat-unread");
        dot.textContent = "●";
        dot.classList.remove("hidden");
        showChatToast(unread[unread.length - 1]);  // pop the newest unread message
      }
    }

    function renderChat(msgs) {
      const el = document.getElementById("chat-messages");
      const { user } = getAuth();
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.username === user ? 'mine' : ''}">
          <span class="chat-name">${escHtml(m.display_name)}</span>
          <span class="chat-text">${escHtml(m.content)}</span>
        </div>`).join("");
      el.scrollTop = el.scrollHeight;
    }

    function toggleChat() {
      chatOpen = !chatOpen;
      document.getElementById("chat-body").style.display = chatOpen ? "flex" : "none";
      document.getElementById("chat-toggle-icon").textContent = chatOpen ? "▼" : "▲";
      document.getElementById("chat-unread").classList.add("hidden");
      hideChatToast();
      if (chatOpen) loadChat();
    }

    async function sendMessage() {
      const { user, sig } = getAuth();
      if (!user || !sig) return;
      const input = document.getElementById("chat-input");
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      await apiFetch(`/api/chat?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      }).catch(() => {});
      await loadChat();
    }

    document.getElementById("chat-input")?.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    const { user: chatUser, sig: chatSig } = getAuth();
    if (!chatUser || !chatSig) {
      document.getElementById("chat-input-row").classList.add("hidden");
      document.getElementById("chat-readonly-note").classList.remove("hidden");
    }

    loadChat();
    setInterval(loadChat, 4_000);
  </script>
</body>
</html>
