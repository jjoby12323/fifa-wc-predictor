<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Engagement · FIFA WC 2026</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
    .gate { max-width: 360px; margin: 60px auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .gate input { padding: 12px; border-radius: 8px; border: 1px solid #2b3b33; background: #0f1713; color: #e8efe9; font-size: 1rem; }
    .btn { padding: 10px 18px; border-radius: 8px; border: none; background: var(--green, #1b8a4b); color: #fff; font-weight: 600; cursor: pointer; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 8px 0 26px; }
    .card { background: #101a14; border: 1px solid #1f2e25; border-radius: 12px; padding: 16px; }
    .card .num { font-size: 1.9rem; font-weight: 700; }
    .card .lbl { color: #8aa595; font-size: .82rem; margin-top: 4px; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin: 26px 0 12px; }
    .md-card { background: #101a14; border: 1px solid #1f2e25; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .md-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .md-date { font-weight: 700; }
    .badge { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .badge.open { background: #1b8a4b33; color: #4ade80; }
    .badge.upcoming { background: #3b82f633; color: #93c5fd; }
    .progress { height: 8px; background: #1f2e25; border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
    .progress > span { display: block; height: 100%; background: var(--green, #1b8a4b); }
    .pending { color: #f0a36b; font-size: .9rem; }
    .pending.none { color: #4ade80; }
    table.act { width: 100%; border-collapse: collapse; }
    table.act th, table.act td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1a261f; }
    table.act th { color: #8aa595; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    table.act td:nth-child(2), table.act td:nth-child(3) { text-align: center; }
    table.act th:nth-child(2), table.act th:nth-child(3) { text-align: center; }
    .muted { color: #6b8275; }
    .err { color: #f87171; min-height: 1em; }
    .announce-box { background: #101a14; border: 1px solid #1f2e25; border-radius: 12px; padding: 16px; margin: 22px 0; }
    .announce-title { font-weight: 700; margin-bottom: 10px; }
    .announce-box textarea { width: 100%; box-sizing: border-box; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b3b33; background: #0f1713; color: #e8efe9; font: inherit; font-size: 0.92rem; }
    .announce-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>🔐 Engagement Admin</h1>
    <nav style="margin-left:auto;display:flex;gap:10px">
      <a href="leaderboard.html" class="nav-link">Leaderboard →</a>
    </nav>
  </header>

  <main class="admin-main">
    <div id="gate" class="gate hidden">
      <p>Enter the admin key to view engagement.</p>
      <input id="key-input" type="password" placeholder="Admin key" autocomplete="off" />
      <button class="btn" onclick="unlock()">Unlock</button>
      <p id="gate-err" class="err"></p>
    </div>

    <div id="dash" class="hidden">
      <div class="topbar">
        <div class="cards" id="cards" style="flex:1"></div>
      </div>
      <button class="btn" onclick="load()">Refresh</button>

      <div class="announce-box">
        <div class="announce-title">📣 Post a message to Slack</div>
        <textarea id="announce-text" rows="3" placeholder="Message to post in the channel as the bot. Supports *bold* and :emoji: shortcodes."></textarea>
        <div class="announce-row">
          <button class="btn" onclick="sendAnnounce()">Post to Slack</button>
          <span id="announce-status" class="muted"></span>
        </div>
      </div>

      <div class="section-title">Voting — open &amp; upcoming matchdays</div>
      <div id="matchdays"></div>

      <div class="section-title">Player activity</div>
      <table class="act">
        <thead><tr><th>Player</th><th>Votes cast</th><th>Chat msgs</th><th>Last active</th></tr></thead>
        <tbody id="players"></tbody>
      </table>

      <p class="muted" id="updated" style="margin-top:16px"></p>
    </div>
  </main>

  <script>
    const KEY_STORE = "wc_admin_key";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const show = id => document.getElementById(id).classList.remove("hidden");
    const hide = id => document.getElementById(id).classList.add("hidden");

    function relTime(iso) {
      if (!iso) return "—";
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      if (s < 86400) return Math.floor(s / 3600) + "h ago";
      return Math.floor(s / 86400) + "d ago";
    }

    async function load() {
      const key = sessionStorage.getItem(KEY_STORE);
      if (!key) { hide("dash"); show("gate"); return; }
      let data;
      try {
        const resp = await fetch("/admin/participation", { headers: { "X-Admin-Key": key } });
        if (resp.status === 403) {
          sessionStorage.removeItem(KEY_STORE);
          document.getElementById("gate-err").textContent = "Invalid admin key.";
          hide("dash"); show("gate");
          return;
        }
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        data = await resp.json();
      } catch (e) {
        document.getElementById("gate-err").textContent = "Failed to load: " + e.message;
        return;
      }
      render(data);
      hide("gate"); show("dash");
    }

    function unlock() {
      const v = document.getElementById("key-input").value.trim();
      if (!v) return;
      sessionStorage.setItem(KEY_STORE, v);
      document.getElementById("gate-err").textContent = "";
      load();
    }

    async function sendAnnounce() {
      const key = sessionStorage.getItem(KEY_STORE);
      const ta = document.getElementById("announce-text");
      const status = document.getElementById("announce-status");
      const text = ta.value.trim();
      if (!text) { status.textContent = "Type a message first."; return; }
      if (!confirm("Post this to the Slack channel?\n\n" + text)) return;
      status.textContent = "Posting…";
      try {
        const resp = await fetch("/admin/announce", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Key": key },
          body: JSON.stringify({ text }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.status === 403) { status.textContent = "Invalid admin key."; return; }
        if (!resp.ok) { status.textContent = data.detail || ("Error " + resp.status); return; }
        if (data.status === "ok") { status.textContent = "Posted ✅"; ta.value = ""; }
        else { status.textContent = "Slack rejected it — check the webhook."; }
      } catch (e) {
        status.textContent = "Failed: " + e.message;
      }
    }

    function render(d) {
      const players = d.players || [];
      const mds = d.matchdays || [];
      const open = mds.filter(m => m.status === "open");
      const nextUp = mds.find(m => m.status === "upcoming");

      const totalVotes = players.reduce((a, p) => a + p.total_votes, 0);
      const totalMsgs = players.reduce((a, p) => a + p.chat_messages, 0);
      const active = players.filter(p => p.total_votes > 0 || p.chat_messages > 0).length;

      // Players who've voted on at least one currently-open matchday (those not in
      // every open matchday's not-voted list).
      let votedOpen = 0;
      if (open.length) {
        const pendingSets = open.map(m => new Set(m.not_voted));
        votedOpen = players.filter(p => !pendingSets.every(s => s.has(p.display_name))).length;
      }
      const openSummary = open.length ? `${votedOpen}/${players.length}` : "—";

      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="num">${players.length}</div><div class="lbl">Players</div></div>
        <div class="card"><div class="num">${active}</div><div class="lbl">Active (voted or chatted)</div></div>
        <div class="card"><div class="num">${openSummary}</div><div class="lbl">Voted while polls open</div></div>
        <div class="card"><div class="num">${totalVotes}</div><div class="lbl">Total votes cast</div></div>
        <div class="card"><div class="num">${totalMsgs}</div><div class="lbl">Chat messages</div></div>`;

      const mdEl = document.getElementById("matchdays");
      let html = open.length
        ? open.map(m => {
            const pct = m.player_count ? Math.round(100 * m.voted_count / m.player_count) : 0;
            const pending = m.not_voted.length
              ? `<span class="pending">Yet to vote: ${m.not_voted.map(esc).join(", ")}</span>`
              : `<span class="pending none">Everyone's in ✅</span>`;
            return `
              <div class="md-card">
                <div class="md-head">
                  <span class="md-date">${esc(m.date)}</span>
                  <span class="badge ${m.status}">${m.status}</span>
                  <span class="muted">· ${m.total_matches} match${m.total_matches === 1 ? "" : "es"}</span>
                  <span style="margin-left:auto">${m.voted_count}/${m.player_count} voted</span>
                </div>
                <div class="progress"><span style="width:${pct}%"></span></div>
                ${pending}
              </div>`;
          }).join("")
        : `<p class="muted">No matchdays open for voting right now.</p>`;
      if (nextUp) {
        const opens = new Date(nextUp.polls_open_utc).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        html += `<p class="muted" style="margin-top:8px">Next up: matchday ${esc(nextUp.date)} — voting opens ${opens}.</p>`;
      }
      mdEl.innerHTML = html;

      const sorted = [...players].sort((a, b) => (b.total_votes - a.total_votes) || (b.chat_messages - a.chat_messages));
      document.getElementById("players").innerHTML = sorted.map(p => `
        <tr>
          <td>${esc(p.display_name)}</td>
          <td>${p.total_votes}</td>
          <td>${p.chat_messages}</td>
          <td class="muted">${relTime(p.last_active)}</td>
        </tr>`).join("");

      document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    }

    document.getElementById("key-input").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    load();
    setInterval(() => { if (sessionStorage.getItem(KEY_STORE)) load(); }, 60_000);
  </script>
</body>
</html>
