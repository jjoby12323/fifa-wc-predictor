<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA WC 2026 Predictor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚽ FIFA WC 2026 Predictor</h1>
    <p id="greeting" class="subtitle"></p>
    <a href="leaderboard.html" class="nav-link" id="leaderboard-link">Leaderboard →</a>
    <a href="bracket.html" class="nav-link" id="bracket-link">Standings & Bracket →</a>
  </header>

  <main id="app">
    <div id="error-banner" class="error-banner hidden"></div>
    <div id="loading" class="loading">Loading matches…</div>
    <div id="matches-container"></div>
  </main>

  <!-- Match detail modal -->
  <div id="match-modal" class="modal-backdrop hidden" onclick="closeMatchModal(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="match-modal-title"></h2>
        <button class="modal-close" aria-label="Close" onclick="closeMatchModal()">✕</button>
      </div>
      <div id="match-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Chat widget -->
  <div id="chat-widget" class="chat-widget">
    <div class="chat-header" onclick="toggleChat()">
      💬 Smack Talk <span id="chat-unread" class="chat-unread hidden"></span>
      <span class="chat-toggle-icon" id="chat-toggle-icon">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row" id="chat-input-row">
        <input id="chat-input" class="chat-input" type="text" placeholder="Say something..." maxlength="280" />
        <button class="chat-send" onclick="sendMessage()">Send</button>
      </div>
      <div id="chat-readonly-note" class="chat-readonly hidden">Open your personal link to chat.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async () => {
      const { user, sig } = getAuth();
      if (!user || !sig) {
        showError("Invalid link. Please use the personal link you were sent.");
        document.getElementById("loading").classList.add("hidden");
        return;
      }
      apiFetch(`/api/whoami?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`)
        .then(data => {
          document.getElementById("greeting").textContent = `Hello, ${data.display_name}!`;
        })
        .catch(() => {
          document.getElementById("greeting").textContent = `Hello, ${user}!`;
        });
      document.getElementById("leaderboard-link").href =
        `leaderboard.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;
      document.getElementById("bracket-link").href =
        `bracket.html?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`;

      await loadMatches();
      setInterval(loadMatches, 60_000);
    })();

    // "Now" view: latest completed matchday (Results) + currently-votable days; re-derived from status each load. Dropdown reaches any day.
    let allByDate = {}, sortedDates = [], view = "now";

    // Display label for a stored pick/result value ("team_a" | "team_b" | "draw").
    const pickName = (m, p) => p === "draw" ? "Draw" : p === "team_a" ? m.team_a : p === "team_b" ? m.team_b : null;

    function localDateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function dayLabel(dk) {
      const [y, mo, da] = dk.split("-").map(Number);
      return new Date(y, mo - 1, da).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    }
    function dayStatus(dk) {
      const ms = allByDate[dk] || [];
      return {
        hasOpen: ms.some(m => m.status === "open"),
        allSettled: ms.length > 0 && ms.every(m => m.status === "settled"),
      };
    }

    async function loadMatches() {
      const { user, sig } = getAuth();
      let matches;
      try {
        matches = await apiFetch(`/api/matches?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`);
      } catch (err) {
        showError(err.message);
        document.getElementById("loading").classList.add("hidden");
        return;
      }
      document.getElementById("loading").classList.add("hidden");

      // Group by LOCAL calendar date — kickoff_utc is UTC, but the user sees their own date.
      allByDate = {};
      for (const m of matches) {
        const raw = m.kickoff_utc.endsWith("Z") || m.kickoff_utc.includes("+") ? m.kickoff_utc : m.kickoff_utc + "Z";
        const dateKey = localDateKey(new Date(raw));
        (allByDate[dateKey] = allByDate[dateKey] || []).push(m);
      }
      sortedDates = Object.keys(allByDate).sort();
      if (view !== "now" && !sortedDates.includes(view)) view = "now";
      render();
    }

    function render() {
      const { user, sig } = getAuth();
      const container = document.getElementById("matches-container");
      if (!sortedDates.length) { container.innerHTML = `<p class="empty-note">No matches to show yet.</p>`; return; }

      const todayKey = localDateKey(new Date());

      let sections;
      if (view === "now") {
        const votable = sortedDates.filter(dk => dayStatus(dk).hasOpen);
        const completed = sortedDates.filter(dk => dayStatus(dk).allSettled);
        sections = [];
        if (completed.length) sections.push({ key: completed[completed.length - 1], tag: "Results" });
        for (const dk of votable) sections.push({ key: dk, tag: "Open for voting" });
        if (!sections.length) {  // nothing live — show the next upcoming day
          sections.push({ key: sortedDates.find(dk => dk >= todayKey) || sortedDates[sortedDates.length - 1], tag: "Upcoming" });
        }
      } else {
        const st = dayStatus(view);
        sections = [{ key: view, tag: st.allSettled ? "Results" : st.hasOpen ? "Open for voting" : "Matches" }];
      }

      const tagFor = dk => { const s = dayStatus(dk); return s.allSettled ? " · done" : s.hasOpen ? " · open" : ""; };
      const opts = [`<option value="now"${view === "now" ? " selected" : ""}> Now — vote &amp; latest result</option>`]
        .concat(sortedDates.map(dk =>
          `<option value="${dk}"${dk === view ? " selected" : ""}>${dayLabel(dk)}${dk === todayKey ? " · Today" : ""}${tagFor(dk)}</option>`))
        .join("");

      container.innerHTML = `
        <div class="day-pager">
          <span class="day-view-label">View</span>
          <select id="day-select" class="day-select">${opts}</select>
        </div>`;

      const tagClass = t => t === "Results" ? "md-tag-done" : t === "Open for voting" ? "md-tag-open" : "md-tag-soon";
      for (const sec of sections) {
        const section = document.createElement("section");
        section.className = "matchday";
        section.innerHTML = `<h2><span class="md-tag ${tagClass(sec.tag)}">${sec.tag}</span><span class="date">${dayLabel(sec.key)}</span></h2>`;
        for (const m of (allByDate[sec.key] || [])) section.appendChild(renderMatchCard(m, user, sig));
        container.appendChild(section);
      }

      document.getElementById("day-select")?.addEventListener("change", e => { view = e.target.value; render(); });
    }

    function renderMatchCard(m, user, sig) {
      const card = document.createElement("div");
      card.className = `match-card status-${m.status} clickable`;
      card.dataset.matchId = m.id;
      card.addEventListener("click", (e) => {
        if (e.target.closest("button")) return; // don't open modal when clicking vote buttons
        openMatchModal(m.id, user, sig);
      });

      const kickoff = new Date(m.kickoff_utc + "Z");
      const stageLabel = { group: "Group Stage", r32: "Round of 32", r16: "Round of 16", qf: "Quarter-Final", sf: "Semi-Final", final: "Final", third: "3rd Place" }[m.stage] || m.stage;
      const statusLabel = { pending: "Not Open Yet", open: "Voting Open", closed: "Kicked Off", settled: "Settled" }[m.status] || m.status;

      let actionHtml = "";
      if (m.status === "open" && !m.my_vote) {
        const underdogA = m.underdog === "team_a" ? `<span class="underdog-hint" title="Lower FIFA-ranked side">⚡ Underdog</span>` : "";
        const underdogB = m.underdog === "team_b" ? `<span class="underdog-hint" title="Lower FIFA-ranked side">⚡ Underdog</span>` : "";
        actionHtml = `
          <div class="vote-buttons">
            <div class="vote-option">
              <button class="btn-vote" onclick="vote(${m.id}, 'team_a')">Vote ${escHtml(m.team_a)}</button>
              ${underdogA}
            </div>
            <div class="vote-option">
              <button class="btn-vote" onclick="vote(${m.id}, 'team_b')">Vote ${escHtml(m.team_b)}</button>
              ${underdogB}
            </div>
          </div>`;
      } else if (m.my_vote) {
        const votedFor = pickName(m, m.my_vote);
        const indicator = m.correct === true ? " ✓" : m.correct === false ? " ✗" : "";
        const cls = m.correct === true ? "correct" : m.correct === false ? "wrong" : "";
        actionHtml = `<div class="voted-badge ${cls}">Your pick: <strong>${escHtml(votedFor)}</strong>${indicator}</div>`;
      }

      let resultHtml = "";
      if (m.status === "settled" && m.result) {
        resultHtml = m.result === "draw"
          ? `<div class="result-badge">Result: <strong>Draw</strong></div>`
          : `<div class="result-badge">Winner: <strong>${escHtml(m.result === "team_a" ? m.team_a : m.team_b)}</strong></div>`;
      }

      card.innerHTML = `
        <div class="match-header">
          <span class="stage-tag">${stageLabel}</span>
          <span class="status-tag ${m.status}">${statusLabel}</span>
        </div>
        <div class="teams">
          <span class="team">${escHtml(m.team_a)}</span>
          <span class="vs">vs</span>
          <span class="team">${escHtml(m.team_b)}</span>
        </div>
        <div class="kickoff">${kickoff.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" })}</div>
        ${resultHtml}
        ${actionHtml}
        <div class="vote-error hidden" id="err-${m.id}"></div>
      `;
      return card;
    }

    // ── Match detail modal ────────────────────────────────────────
    async function openMatchModal(matchId, user, sig) {
      const modal = document.getElementById("match-modal");
      document.getElementById("match-modal-title").textContent = "";
      document.getElementById("match-modal-body").innerHTML = `
        <div class="mo-loading">
          <div class="mo-spinner"></div>
          <span>Loading…</span>
        </div>`;
      modal.classList.remove("hidden");

      let m;
      try {
        m = await apiFetch(`/api/matches/${matchId}?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`);
      } catch (err) {
        document.getElementById("match-modal-body").innerHTML =
          `<p style="color:var(--red);padding:24px;text-align:center">${err.message}</p>`;
        return;
      }

      try {

      const STAGE_LABELS = { group: "Group Stage", r32: "Round of 32", r16: "Round of 16", qf: "Quarter-Final", sf: "Semi-Final", final: "Final", third: "3rd Place" };
      const stageLabel = STAGE_LABELS[m.stage] || m.stage;
      // kickoff_utc arrives as a naive ISO string ("2026-06-15T18:00:00") — append Z so JS treats it as UTC
      const rawKo = m.kickoff_utc.endsWith("Z") || m.kickoff_utc.includes("+") ? m.kickoff_utc : m.kickoff_utc + "Z";
      const kickoff = new Date(rawKo);
      const kickoffStr = isNaN(kickoff)
        ? m.kickoff_utc
        : kickoff.toLocaleString(undefined, {
            weekday: "short", month: "short", day: "numeric",
            hour: "2-digit", minute: "2-digit", timeZoneName: "short"
          });

      const isUnderdog = (side) => m.underdog === side;
      const flagA = getFlagUrl(m.team_a);
      const flagB = getFlagUrl(m.team_b);
      const flagImgA = flagA
        ? `<img class="mo-flag" src="${flagA}" alt="${escHtml(m.team_a)} flag" onerror="this.style.display='none'">`
        : `<div class="mo-flag-placeholder">🏳</div>`;
      const flagImgB = flagB
        ? `<img class="mo-flag" src="${flagB}" alt="${escHtml(m.team_b)} flag" onerror="this.style.display='none'">`
        : `<div class="mo-flag-placeholder">🏳</div>`;

      const votedA      = m.votes.filter(v => v.prediction === "team_a");
      const votedB      = m.votes.filter(v => v.prediction === "team_b");
      const votedHidden = m.votes.filter(v => v.prediction === "hidden");
      const notVoted    = m.votes.filter(v => !v.prediction);
      const total       = m.votes.length;

      const pctA = total ? Math.round((votedA.length / total) * 100) : 0;
      const pctB = total ? Math.round((votedB.length / total) * 100) : 0;

      const chipList = (list) => list.length
        ? list.map(v => `<span class="mo-chip">${escHtml(v.display_name)}</span>`).join("")
        : `<span class="mo-chip-empty">—</span>`;

      const winnerA = m.result === "team_a";
      const winnerB = m.result === "team_b";
      const drawResult = m.result === "draw";

      // ── Voting action: pick / change / remove when open, read-only otherwise ──
      let actionHtml = "";
      if (m.status === "open") {
        const pickedA = m.my_vote === "team_a";
        const pickedB = m.my_vote === "team_b";
        actionHtml = `
          <div class="mo-vote-section">
            <div class="mo-vote-title">${m.my_vote ? "Your pick — tap to change" : "Make your pick"}</div>
            <div class="mo-vote-btns">
              <button type="button" class="mo-vote-btn ${pickedA ? "picked" : ""}" onclick="voteFromModal(${m.id}, 'team_a')">
                ${pickedA ? "✓ " : ""}${escHtml(m.team_a)}
              </button>
              <button type="button" class="mo-vote-btn ${pickedB ? "picked" : ""}" onclick="voteFromModal(${m.id}, 'team_b')">
                ${pickedB ? "✓ " : ""}${escHtml(m.team_b)}
              </button>
            </div>
            ${m.my_vote ? `<button type="button" class="mo-revoke-btn" onclick="revokeFromModal(${m.id})">✕ Remove my pick</button>` : ""}
            <div class="mo-vote-err hidden" id="mo-vote-err"></div>
          </div>`;
      } else if (m.status === "pending") {
        const rawPo = m.polls_open_utc.endsWith("Z") || m.polls_open_utc.includes("+") ? m.polls_open_utc : m.polls_open_utc + "Z";
        const po = new Date(rawPo);
        const poStr = isNaN(po) ? "" : po.toLocaleString(undefined, {
          weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
        actionHtml = `<div class="mo-vote-locked">⏳ Voting opens ${poStr}</div>`;
      } else if (m.my_vote) {
        const votedFor = pickName(m, m.my_vote);
        const mark = !m.result
          ? ""
          : m.result === "draw"
            ? ` <span class="mo-mark-draw">— draw</span>`
            : (m.my_vote === m.result ? ` <span class="mo-mark-ok">✓</span>` : ` <span class="mo-mark-no">✗</span>`);
        actionHtml = `<div class="mo-vote-locked">🔒 Your pick: <strong>${escHtml(votedFor)}</strong>${mark}</div>`;
      } else {
        actionHtml = `<div class="mo-vote-locked">🔒 Voting closed — no pick made</div>`;
      }

      document.getElementById("match-modal-title").innerHTML =
        `<span class="mo-stage-badge">${stageLabel}</span>`;

      document.getElementById("match-modal-body").innerHTML = `
        <div class="mo-kickoff">

          <!-- Teams row -->
          <div class="mo-teams-row">
            <div class="mo-team ${isUnderdog("team_a") ? "mo-underdog" : ""} ${winnerA ? "mo-winner" : ""}">
              <div class="mo-flag-wrap">${flagImgA}</div>
              <div class="mo-team-name">${escHtml(m.team_a)}</div>
              <div class="mo-rank">FIFA #${m.fifa_rank_a}</div>
              ${isUnderdog("team_a") ? `<div class="mo-dog-badge">⚡ Underdog</div>` : ""}
            </div>

            <div class="mo-vs-col">
              ${m.result
                ? `<div class="mo-result-crown">${drawResult ? "Draw" : (winnerA ? escHtml(m.team_a) : escHtml(m.team_b)) + " wins"}</div>`
                : `<div class="mo-vs">VS</div>`}
              <div class="mo-kickoff-time">🕐 ${kickoffStr}</div>
              ${m.stage !== "group" ? `<div class="mo-stage-note">${stageLabel}</div>` : ""}
            </div>

            <div class="mo-team ${isUnderdog("team_b") ? "mo-underdog" : ""} ${winnerB ? "mo-winner" : ""}">
              <div class="mo-flag-wrap">${flagImgB}</div>
              <div class="mo-team-name">${escHtml(m.team_b)}</div>
              <div class="mo-rank">FIFA #${m.fifa_rank_b}</div>
              ${isUnderdog("team_b") ? `<div class="mo-dog-badge">⚡ Underdog</div>` : ""}
            </div>
          </div>

          <!-- Voting action -->
          ${actionHtml}

          <!-- Prediction bar -->
          <div class="mo-pred-section">
            <div class="mo-pred-header">
              <span>Predictions</span>
              <span class="mo-pred-total">${total} participant${total !== 1 ? "s" : ""}</span>
            </div>

            ${(votedA.length + votedB.length) > 0 ? `
            <div class="mo-bar-wrap">
              <div class="mo-bar-label-left">${escHtml(m.team_a)} · ${votedA.length}</div>
              <div class="mo-bar">
                <div class="mo-bar-a ${winnerA ? "mo-bar-win" : ""}" style="width:${pctA}%"></div>
                <div class="mo-bar-b ${winnerB ? "mo-bar-win" : ""}" style="width:${pctB}%"></div>
              </div>
              <div class="mo-bar-label-right">${votedB.length} · ${escHtml(m.team_b)}</div>
            </div>` : ""}

            <div class="mo-split">
              <div class="mo-split-col">
                <div class="mo-split-head ${winnerA ? "mo-split-head-win" : ""}">${escHtml(m.team_a)}</div>
                <div class="mo-chips">${chipList(votedA)}</div>
              </div>
              <div class="mo-split-divider"></div>
              <div class="mo-split-col">
                <div class="mo-split-head ${winnerB ? "mo-split-head-win" : ""}">${escHtml(m.team_b)}</div>
                <div class="mo-chips">${chipList(votedB)}</div>
              </div>
            </div>

            ${votedHidden.length ? `
              <div class="mo-hidden-note">
                🔒 ${votedHidden.length} vote${votedHidden.length > 1 ? "s" : ""} sealed — revealed after kickoff
              </div>` : ""}
            ${notVoted.length ? `
              <div class="mo-not-voted">
                ⏳ No pick yet: ${notVoted.map(v => escHtml(v.display_name)).join(", ")}
              </div>` : ""}
          </div>

        </div>`;

      } catch (renderErr) {
        console.error("Match modal render error:", renderErr);
        document.getElementById("match-modal-body").innerHTML =
          `<p style="color:var(--red);padding:24px;text-align:center">
            Failed to render match details.<br>
            <code style="font-size:0.78rem;color:var(--muted)">${escHtml(renderErr.message)}</code>
          </p>`;
      }
    }

    function closeMatchModal(e) {
      if (!e || e.target === document.getElementById("match-modal")) {
        document.getElementById("match-modal").classList.add("hidden");
      }
    }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMatchModal(); });

    // ── Chat ──────────────────────────────────────────────────────
    let chatOpen = false;
    let lastSeenId = 0;       // newest message id the user has already seen
    let chatPrimed = false;   // first poll seeds the baseline so existing history isn't "unread"

    async function loadChat() {
      const msgs = await apiFetch("/api/chat").catch(() => []);
      renderChat(msgs);

      const latestId = msgs.length ? msgs[msgs.length - 1].id : 0;

      // First load: treat all existing messages as seen — only notify going forward.
      if (!chatPrimed) {
        lastSeenId = latestId;
        chatPrimed = true;
        return;
      }

      // Chat open: the user is reading in real time, so keep the baseline current.
      if (chatOpen) {
        lastSeenId = latestId;
        return;
      }

      // Chat closed: anything newer than the baseline (and not your own) is unread.
      const { user } = getAuth();
      const unread = msgs.filter(m => m.id > lastSeenId && m.username !== user);
      if (unread.length) {
        const dot = document.getElementById("chat-unread");
        dot.textContent = "●";
        dot.classList.remove("hidden");
        showChatToast(unread[unread.length - 1]);  // pop the newest unread message
      }
    }

    function renderChat(msgs) {
      const el = document.getElementById("chat-messages");
      const { user } = getAuth();
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.username === user ? 'mine' : ''}">
          <span class="chat-name">${escHtml(m.display_name)}</span>
          <span class="chat-text">${escHtml(m.content)}</span>
        </div>`).join("");
      el.scrollTop = el.scrollHeight;
    }

    function toggleChat() {
      chatOpen = !chatOpen;
      document.getElementById("chat-body").style.display = chatOpen ? "flex" : "none";
      document.getElementById("chat-toggle-icon").textContent = chatOpen ? "▼" : "▲";
      document.getElementById("chat-unread").classList.add("hidden");
      hideChatToast();
      if (chatOpen) loadChat();
    }

    async function sendMessage() {
      const { user, sig } = getAuth();
      if (!user || !sig) return;
      const input = document.getElementById("chat-input");
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      await apiFetch(`/api/chat?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      }).catch(() => {});
      await loadChat();
    }

    document.getElementById("chat-input")?.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    const { user: chatUser, sig: chatSig } = getAuth();
    if (!chatUser || !chatSig) {
      document.getElementById("chat-input-row").classList.add("hidden");
      document.getElementById("chat-readonly-note").classList.remove("hidden");
    }

    loadChat();
    setInterval(loadChat, 4_000);

    // ── Votes ──────────────────────────────────────────────────────
    async function vote(matchId, prediction) {
      const { user, sig } = getAuth();
      const errEl = document.getElementById(`err-${matchId}`);
      errEl.classList.add("hidden");
      try {
        await apiFetch(`/api/vote?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ match_id: matchId, prediction }),
        });
        await loadMatches();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      }
    }

    function showModalVoteError(msg) {
      const e = document.getElementById("mo-vote-err");
      if (e) { e.textContent = msg; e.classList.remove("hidden"); }
    }

    async function voteFromModal(matchId, prediction) {
      const { user, sig } = getAuth();
      try {
        await apiFetch(`/api/vote?user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ match_id: matchId, prediction }),
        });
        await openMatchModal(matchId, user, sig);  // refresh modal
        loadMatches();                              // refresh cards behind it
      } catch (err) {
        showModalVoteError(err.message);
      }
    }

    async function revokeFromModal(matchId) {
      const { user, sig } = getAuth();
      try {
        await apiFetch(`/api/vote?match_id=${matchId}&user=${encodeURIComponent(user)}&sig=${encodeURIComponent(sig)}`, {
          method: "DELETE",
        });
        await openMatchModal(matchId, user, sig);
        loadMatches();
      } catch (err) {
        showModalVoteError(err.message);
      }
    }
  </script>
</body>
</html>
